<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pedir — Mesas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Hacé tu pedido</h1>
    <p class="sub">Elegí tu mesa y agregá lo que quieras.</p>
  </header>
  <main>
    <div class="tarjeta">
      <label for="mesa" class="sub">Mesa</label>
      <select id="mesa"></select>
    </div>
    <!-- Mismo lugar relativo que en el panel del mozo, y afuera de #mis-pedidos:
         el aviso tiene que verse aunque todavía no haya pedidos, y el espacio
         queda reservado para que la lista no se mueva al aparecer o irse. -->
    <p id="conexion" class="conexion" role="status"></p>
    <!-- Arriba de la carta: una vez que pidió, lo primero que el cliente quiere
         saber es cómo viene lo suyo. Oculta mientras no pidió nada. -->
    <section id="mis-pedidos" hidden>
      <h2>Tus pedidos</h2>
      <div id="activos"></div>
      <div id="cerrados"></div>
    </section>
    <div id="carta"></div>
    <p id="msg" class="aviso"></p>
  </main>
  <div class="barra">
    <span class="total crece">$<span id="total">0</span></span>
    <button id="enviar" class="primario" disabled>Pedir</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
